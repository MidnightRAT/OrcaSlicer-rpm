name: Build OrcaSlicer RPM

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.copr/**'
  workflow_dispatch:
  schedule:
    # Run weekly to check for new releases
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /github 2>/dev/null || df -h /
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/share/swift /usr/local/share/powershell /usr/share/powershell \
            /usr/local/lib/python* /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf /usr/share/doc /usr/share/man /usr/share/info 2>/dev/null || true
          rm -rf /root/.cache /root/.npm /var/cache /var/lib/apt/lists 2>/dev/null || true
          dnf -y clean all 2>/dev/null || true
          df -h / | tail -1

      # Only the tooling needed to fetch the sources and generate the spec.
      # Everything the spec actually BuildRequires is installed by
      # "dnf builddep" below, so the dependency list lives in one place.
      - name: Install bootstrap tools
        run: |
          dnf install -y rpm-build rpmdevtools git git-lfs wget curl unzip

      - name: Get latest release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use authenticated request to avoid rate limiting (60 req/hr unauth)
          LATEST=$(curl -sL -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest \
            | grep '"tag_name"' | cut -d '"' -f 4 | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to determine latest OrcaSlicer version"
            exit 1
          fi
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Download source tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          wget -q --header="Authorization: token $GH_TOKEN" \
            "https://github.com/OrcaSlicer/OrcaSlicer/archive/refs/tags/v${VERSION}.tar.gz" \
            -O OrcaSlicer-${VERSION}.tar.gz

      - name: Prepare RPM build tree
        run: |
          VERSION=${{ steps.version.outputs.version }}
          rpmdev-setuptree
          cp OrcaSlicer-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          cp README.md ~/rpmbuild/SOURCES/
          for p in patches/0*.patch; do
            cp "$p" ~/rpmbuild/SOURCES/
          done

      - name: Update spec file with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Create spec file from template with correct version
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@RELEASE@/7/g" \
              orca-slicer.spec > ~/rpmbuild/SPECS/orca-slicer.spec

      - name: Install build dependencies
        run: dnf builddep -y ~/rpmbuild/SPECS/orca-slicer.spec

      - name: Build RPM and SRPM
        run: |
          cd ~/rpmbuild
          rpmbuild -ba SPECS/orca-slicer.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-slicer-rpm
          path: |
            ~/rpmbuild/RPMS/x86_64/*.rpm
            ~/rpmbuild/SRPMS/*.rpm
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OrcaSlicer ${{ steps.version.outputs.version }}
          files: |
            ~/rpmbuild/RPMS/x86_64/*.rpm
            ~/rpmbuild/SRPMS/*.rpm
          fail_on_unmatched_files: true
          make_latest: true